<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday Fiar Vedini</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif}
body{height:100vh;overflow:hidden;background:black;color:white}

/* VIDEO */
video{
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
  z-index:-3;
}

/* OVERLAY */
.overlay{
  position:fixed;
  inset:0;
  background:linear-gradient(120deg,rgba(255,154,158,.55),rgba(250,208,196,.55));
  animation:hue 10s infinite alternate;
  z-index:-2;
}
@keyframes hue{to{filter:hue-rotate(40deg)}}

/* START SCREEN */
.start{
  position:fixed;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  background:black;
  z-index:10;
  flex-direction:column;
  text-align:center;
}
.start h1{font-size:2.5rem;margin-bottom:20px}
.start button{
  padding:15px 40px;
  border:none;
  border-radius:40px;
  font-size:1.1rem;
  cursor:pointer;
}

/* MAIN */
.main{
  height:100vh;
  display:none;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  text-align:center;
  padding:20px;
  animation:fade 2s forwards;
}
@keyframes fade{from{opacity:0}to{opacity:1}}

h1{font-size:3rem}
h2{
  font-size:3.5rem;
  margin-top:10px;
  animation:glow 2s infinite alternate;
}
@keyframes glow{
  from{text-shadow:0 0 10px #fff}
  to{text-shadow:0 0 40px #fbc2eb}
}

/* CAKE */
.cake{
  margin:40px 0;
  width:160px;
  height:120px;
  background:#ffb6c1;
  border-radius:10px;
  position:relative;
}
.candle{
  position:absolute;
  top:-30px;
  left:50%;
  transform:translateX(-50%);
  width:10px;
  height:30px;
  background:white;
  cursor:pointer;
}
.flame{
  position:absolute;
  top:-15px;
  left:-5px;
  width:20px;
  height:20px;
  background:orange;
  border-radius:50%;
  animation:flicker 1s infinite;
}
@keyframes flicker{50%{transform:scale(.8)}}

/* GIFT */
.gift{
  font-size:3rem;
  cursor:pointer;
  margin-top:20px;
}

/* LETTER */
.letter{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.8);
  display:none;
  align-items:center;
  justify-content:center;
  padding:20px;
}
.letter-content{
  background:white;
  color:black;
  padding:30px;
  border-radius:20px;
  max-width:500px;
  text-align:center;
}
.letter-content h3{margin-bottom:15px}

/* LOVE CLICK */
.love{
  position:absolute;
  animation:love 2s forwards;
}
@keyframes love{
  to{transform:translateY(-80px) scale(1.5);opacity:0}
}

/* MUSIC BTN */
.music{
  margin-top:25px;
  padding:10px 25px;
  border:none;
  border-radius:30px;
  cursor:pointer;
}
</style>
</head>

<body>

<!-- START -->
<div class="start">
  <h1>🎂 Special Day 🎂</h1>
  <p>Tap untuk memulai kejutan</p>
  <button onclick="start()">Tap to Start</button>
</div>

<!-- VIDEO -->
<video autoplay muted loop>
  <source src="vid3.mp4" type="video/mp4">
</video>
<div class="overlay"></div>

<audio id="music" loop>
  <source src="abot.mpeg" type="audio/mpeg">
</audio>

<!-- MAIN -->
<div class="main" id="main">
  <h1>Happy Birthday</h1>
  <h2>Fiar Vedini 🎂</h2>

  <div class="cake">
    <div class="candle" onclick="blow()">
      <div class="flame" id="flame"></div>
    </div>
  </div>
  <small>Klik lilinnya 🕯️</small>

  <div class="gift" onclick="openGift()">🎁</div>
  <small>Klik kado</small>

  <button class="music" onclick="toggleMusic()">🎶 Play / Pause Music</button>
</div>



<script>
const music=document.getElementById("music");

function start(){
  document.querySelector(".start").style.display="none";
  document.getElementById("main").style.display="flex";
  music.play();
}

function toggleMusic(){
  music.paused?music.play():music.pause();
}

function blow(){
  document.getElementById("flame").style.display="none";
}

function openGift(){
  document.body.style.opacity = "0";
  setTimeout(()=>{
    window.location.href = "https://untuk-fiar-vedini.vercel.app/";
  },1000);
}

/* LOVE EFFECT */
document.addEventListener("click",e=>{
  const l=document.createElement("div");
  l.className="love";
  l.innerHTML="❤️";
  l.style.left=e.clientX+"px";
  l.style.top=e.clientY+"px";
  document.body.appendChild(l);
  setTimeout(()=>l.remove(),2000);
});
</script>

</body>
</html>
